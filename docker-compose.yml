services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miracleshine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miracleshine_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-miracleshine}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5433"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-miracleshine} -d ${POSTGRES_DB:-miracleshine}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-miracleshine}:${POSTGRES_PASSWORD:-miracleshine_dev_password}@db:5432/${POSTGRES_DB:-miracleshine}?schema=public
      PORT: ${BACKEND_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-secret-change-me}
    init: true
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - backend-generated:/app/generated
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev" // this command seeds the db on build make sure to remove when deploying
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-3000}}
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  backend-node-modules:
  backend-generated:
  frontend-node-modules: